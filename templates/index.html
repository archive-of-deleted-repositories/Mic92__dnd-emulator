<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>D&D Emulator</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>D&D Emulator</h1>
        <p>Claude as your Game Master</p>
      </header>

      <main>
        <div class="game-area">
          <div class="chat-container">
            <div id="chat-messages" class="chat-messages">
              <div class="message gm-message">
                <strong>GM:</strong> Welcome to the adventure! Describe your
                character and let's begin...
              </div>
            </div>

            <div class="input-area">
              <input
                type="text"
                id="message-input"
                placeholder="Type your action or message..."
                autocomplete="off"
              />
              <button id="send-button">Send</button>
            </div>
          </div>

          <div class="sidebar">
            <div class="dice-roller">
              <h3>Dice Roller</h3>
              <div class="dice-buttons">
                <button class="dice-btn" data-dice="1d20">d20</button>
                <button class="dice-btn" data-dice="1d12">d12</button>
                <button class="dice-btn" data-dice="1d10">d10</button>
                <button class="dice-btn" data-dice="1d8">d8</button>
                <button class="dice-btn" data-dice="1d6">d6</button>
                <button class="dice-btn" data-dice="1d4">d4</button>
              </div>
              <div class="custom-dice">
                <input type="text" id="custom-dice" placeholder="e.g., 2d6+3" />
                <button id="roll-custom">Roll</button>
              </div>
              <div id="dice-results" class="dice-results"></div>
            </div>

            <div class="game-info">
              <h3>Session Info</h3>
              <div class="session-selector">
                <label for="session-select">Session:</label>
                <select id="session-select">
                  <option value="">New Session</option>
                </select>
                <button id="refresh-sessions" title="Refresh sessions">↻</button>
              </div>
              <p>Session: <span id="session-id">New</span></p>
              <p>Status: <span id="connection-status">Connecting...</span></p>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script src="{{ url_for('static', filename='js/game.js') }}"></script>
  </body>
</html>

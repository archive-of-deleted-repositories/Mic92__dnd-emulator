[project]
name = "dnd-emulator"
version = "0.1.0"
description = "A D&D emulator with Claude as the Game Master"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.0.0",
    "flask-socketio>=5.3.0",
    "python-socketio>=5.10.0",
    "flask-cors>=4.0.0",
    "types-flask>=1.1.6",
    "types-flask-cors>=4.0.0",
    "types-flask-socketio>=5.5.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-stub>=1.1.0",
]

[project.scripts]
dnd-emulator = "dnd_emulator.__main__:main"

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dnd_emulator"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.hatch.build]
include = [
    "src/dnd_emulator/**/*.txt",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "S101",  # Allow assert in tests
    "S603",  # Allow subprocess with shell=False (PATH lookups)
    "D203",  # incorrect-blank-line-before-class (conflicts with D211)
    "D213",  # multi-line-summary-second-line (conflicts with D212)
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
known-first-party = ["dnd_emulator"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_unimported = true
no_implicit_optional = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_optional = true
strict_equality = true
ignore_missing_imports = false
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "socketio",
    "flask_cors",
    "flask_socketio",
]
ignore_missing_imports = true
